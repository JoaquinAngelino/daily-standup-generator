<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Daily Standup Generator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect y='9' width='32' height='14' fill='%231d8a4e'/%3E%3Cpath d='M7 16h18' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="layout">
    <div class="main-col">
      <header class="topbar">
        <h1 class="brand" data-i18n="title">Daily Standup Generator</h1>
        <nav class="tabs" aria-label="Views" data-i18n-label="views">
          <a class="tab" href="#standup" aria-current="page" data-i18n="standupTab">Standup</a>
          <a class="tab" href="#tracker" data-i18n="trackerTab">Tracker</a>
        </nav>
        <span id="today" class="today"></span>
        <button id="settingsToggle" type="button" class="btn" aria-expanded="false" aria-controls="settings" data-i18n="settings">Settings</button>
        <button id="outputToggle" type="button" class="btn" aria-expanded="true" aria-controls="outputPanel" data-i18n="output">Output</button>
        <label class="sr-only" for="language" data-i18n="language">Language</label>
        <select id="language" class="lang">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </header>

      <section id="settings" class="settings" hidden>
        <div class="setting">
          <label class="field">
            <span class="field-label" data-i18n="token">GitHub token</span>
            <input id="token" type="password" autocomplete="off" spellcheck="false">
          </label>
          <label class="check">
            <input id="remember" type="checkbox">
            <span data-i18n="remember">Remember on this device</span>
          </label>
          <p class="hint" data-i18n="tokenHint"></p>
          <div class="row">
            <button id="forgetToken" type="button" class="btn" data-i18n="forgetToken">Forget token</button>
            <span id="tokenStatus" class="status" role="status"></span>
          </div>
        </div>
        <div class="setting">
          <label class="field">
            <span class="field-label" data-i18n="repos">Repositories</span>
            <textarea id="repos" rows="3" spellcheck="false" placeholder="owner/repo"></textarea>
          </label>
          <p class="hint" data-i18n="reposHint"></p>
          <span id="reposStatus" class="status" role="status"></span>
        </div>
      </section>

      <main id="standupView" class="work">
        <section class="lane" data-section="completed" aria-labelledby="lane-completed">
          <div class="lane-head">
            <h2 id="lane-completed" class="lane-title" data-i18n="completed">Completed</h2>
            <span class="lane-count"></span>
            <span class="lane-tools"></span>
            <button type="button" class="btn-text" data-add><span data-i18n="addIssue">Add issue</span></button>
          </div>
          <div class="rows"></div>
        </section>

        <section class="lane" data-section="inProgress" aria-labelledby="lane-inProgress">
          <div class="lane-head">
            <h2 id="lane-inProgress" class="lane-title" data-i18n="inProgress">In Progress</h2>
            <span class="lane-count"></span>
            <span class="lane-tools"></span>
            <button type="button" class="btn-text" data-add><span data-i18n="addIssue">Add issue</span></button>
          </div>
          <div class="rows"></div>
        </section>

        <section class="lane" data-section="upcoming" aria-labelledby="lane-upcoming">
          <div class="lane-head">
            <h2 id="lane-upcoming" class="lane-title" data-i18n="upcoming">Upcoming</h2>
            <span class="lane-count"></span>
            <span class="lane-tools"></span>
            <button type="button" class="btn-text" data-add><span data-i18n="addIssue">Add issue</span></button>
          </div>
          <div class="rows"></div>
        </section>

        <section class="lane" data-section="prs" aria-labelledby="lane-prs">
          <div class="lane-head">
            <h2 id="lane-prs" class="lane-title" data-i18n="prs">PR Review</h2>
            <span class="lane-count"></span>
            <span class="lane-tools"></span>
            <button type="button" class="btn-text" data-add><span data-i18n="addPr">Add PR</span></button>
          </div>
          <div class="rows"></div>
        </section>
      </main>

      <main id="trackerView" class="work" hidden></main>
    </div>

    <aside id="outputPanel" class="output" aria-labelledby="output-title">
      <div class="output-head">
        <h2 id="output-title" data-i18n="output">Output</h2>
        <span id="copyStatus" class="status" role="status"></span>
        <button id="copySlack" type="button" class="btn" data-i18n="copySlack">Copy for Slack</button>
        <button id="copyGithub" type="button" class="btn" data-i18n="copyGithub">Copy for GitHub</button>
      </div>
      <div id="banner" class="banner" role="alert" hidden></div>
      <label class="sr-only" for="output" data-i18n="output">Output</label>
      <textarea id="output" spellcheck="false"></textarea>
      <div class="output-foot">
        <p class="hint" data-i18n="outputHint"></p>
        <button id="generate" type="button" class="tape tape--black generate" data-i18n="generate">Generate standup</button>
      </div>
    </aside>
  </div>
</body>
</html>
